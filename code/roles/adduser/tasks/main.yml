- name: Add user block
  block:

    - name: Create user
      user:
        name: "{{ username }}"
        state: present
        shell: /bin/bash
        create_home: yes

    - name: Add SSH key
      authorized_key:
        user: "{{ username }}"
        state: present
        key: "{{ ssh_key }}"

    - name: Add sudoers entry
      copy:
        dest: "/etc/sudoers.d/{{ username }}"
        content: "{{ username }} ALL=(ALL) NOPASSWD: ALL"
        mode: '0440'
